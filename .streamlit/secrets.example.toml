# Rename this file to .streamlit/secrets.toml after filling in your real values.
# These are read by Streamlit Cloud as env vars for the bot and web chat.
DISCORD_TOKEN = "YOUR_DISCORD_BOT_TOKEN"
GROQ_API_KEY = "gsk_..."

# Model / endpoint (Groq OpenAI-compatible)
GEMINI_MODEL = "llama-3.3-70b-versatile"
GEMINI_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions"

# User lists: comma-separated Discord user IDs
BLOCKED_USER_IDS = ""
SLOW_USER_IDS = ""
RESPECTED_USER_IDS = ""

# known-users: newline-separated "ID name" entries inside the secret string
# KNOWN_USER_IDS = "1396370445917225026 Alex\n1378139379259932732 Sam"

# watched channels: comma-separated Discord channel IDs
WATCH_CHANNEL_IDS = ""

SLOW_MODE_MS = "15000"
